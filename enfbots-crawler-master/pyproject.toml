[tool.poetry]
name = "enfbots-crawler"
version = "0.8.11"
description = "Web crawler for automatic registration on web pages"
authors = ["Luka Lodrant <luka.lodrant@inf.ethz.ch>"]

[tool.poetry.scripts]
enfbot = "enfbots_crawler.main:main"

[tool.poetry.group.test.dependencies]
Flask = "^3.0.0"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.3.1"
pytest-mock = "^3.6.1"
types-PyYAML = "^6.0.12.3"
SQLAlchemy = {extras = ["mypy"], version = "2.0.45"}
types-requests = "^2.26.2"
types-selenium = "^3.141.6"
lxml-stubs = "^0.5.0"
types-setuptools = "^69.1.0.0"
pandas-stubs = "^2.0.0"
types-beautifulsoup4 = "^4.11.6.3"
types-docopt = "^0.6.11.1"
tqdm-stubs = "^0.2.1"
types-babel = "^2.11.0.9"
types-pillow = "^10.0.0.0"

[tool.black]
line-length = 100

[tool.coverage.run]
omit = [
    "enfbots_crawler/libs/*",
    "enfbots_crawler/alembic/*"
]

[tool.mypy]
junit_xml = "report.xml"

[[tool.mypy.overrides]]
module = ["enfbots_crawler.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "enfbots_crawler.libs.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "dill"
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "polyglot.*",
    "sortedcontainers",
    "tqdm",
    "pqdm.threads.*",
    "pyngrok",
    "tldextract",
    "rstr",
    "seleniumwire.*",
    "undetected_chromedriver",
    "nltk.*",
    "readabilipy",
    "babel.*",
    "twocaptcha.*",
    "icu.*",
    "flak_app",
    "lemmagen3",
    "cyrtranslit"
]
ignore_missing_imports = true


[tool.poetry.dependencies]
python = ">3.10,<4.0"
requests = "^2.30.0"
2captcha-python = "^1.1.0"
beautifulsoup4 = "^4.10.0"
hyperlink = "^21.0.0"
joblib = "^1.1.0"
lxml = "^6.0.0"
nltk = "^3.6.6"
polyglot = "^16.7.4"
psycopg2 = "^2.9.2"
pycld2 = "0.42"
PyICU = "^2.11"
readabilipy = {git = "https://github.com/dbernhard-0x7CD/ReadabiliPy.git"}
rstr = "^3.0.0"
# ATTENTION: make sure to check that the selenium version is compatible with the chrome version installed in `Dockerfile`
selenium = "4.39.0"
selenium-wire = "5.1.0"
sortedcontainers = "^2.4.0"
spacy = "^3.8.2"
SQLAlchemy = "2.0.45"
tldextract = "^5.1.1"
tqdm = "^4.62.3"
Unidecode = "^1.3.2"
PyYAML = "^6.0"
alembic = "^1.7.7"
cyrtranslit = "^1.0"
lemmagen3 = "^3.5.0"
pandas = "^2.0.2"
dill = "^0.3.6"
scipy = "^1.11.2"
html2text = "^2024.2.26"
scikit-learn = "^1.2.1"
falcon = "^4.2.0"
falcon-auth = "^1.1.0"
gcld3 = "^3.0.13"
pdfminer-six = "^20240706"
undetected-chromedriver = "3.5.5"
urllib3 = "^2.0.6"
selenium-stealth = "^1.0.6"
pqdm = "^0.2.0"
google-cloud = "^0.34.0"
google-cloud-bigquery = "^3.10.0"
google-cloud-translate = "^3.7.2"
db-dtypes = "^1.1.1"
babel = "^2.14.0"
blinker = "1.7.0"
numpy = "^2.0.0"
google-cloud-bigquery-storage = "^2.25.0"
psutil = "^6.0.0"
pyvirtualdisplay = "^3.0"

[tool.poetry.group.dev.dependencies]
ipython-sql = "^0.5.0"
mypy = "^1.8.0"
seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
