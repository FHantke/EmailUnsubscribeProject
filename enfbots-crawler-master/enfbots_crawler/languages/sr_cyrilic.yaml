  "[ваш|твој|] [фиксни|мобилни|кућни|] [број|бр.] [телефона|тел.]":
  "[ваш|твој|] [број|бр.] [фиксног|мобилног|кућног|] [телефона|тел.]":
  "[ваш|твој|] [фиксни|мобилни|кућни|] телефонски [број|бр.]":
