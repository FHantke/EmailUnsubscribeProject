  "[ваш|твој|] улични [број|бр.]":
  "[ваш|твој|] [број|бр.] улице":
# form label: street name + number (e. g. Ramistrasse 101)
street_full_input:
  "[ваша|твоја|] улица и број":
  "адресни ред":
# form label: city
city_input:
  "[ваш|твој|] град":
  "[ваша|твоја|] општина":
  "[ваше|твоје|] [место|пребивалиште]":
# form label: zip/post code
