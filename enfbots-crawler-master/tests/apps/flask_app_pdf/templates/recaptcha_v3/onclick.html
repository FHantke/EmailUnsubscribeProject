<html>
<head>
    <title>reCAPTCHA demo: Simple page</title>
    <script type="text/javascript">
        var submitCall = function (e) {
            e.preventDefault()
            grecaptcha.ready(function () {
                grecaptcha.execute("{{ config.site_key_recaptcha_v3 }}", {action: "submit_action"}).then(function (token) {
                    document.getElementById("resp").value = token;
                    document.getElementById("formid").submit();
                });
            });
        }
        var fakeCall = function (e) {
            e.preventDefault()
            grecaptcha.ready(function () {
                grecaptcha.execute("{{ config.site_key_recaptcha_v3 }}", {action: "fake_action"}).then(function (token) {
                    console.log(token);
                });
            });
        }
    </script>
    <script src="https://www.google.com/recaptcha/api.js?render={{ config.site_key_recaptcha_v3 }}"></script>
</head>
<body>
<form id="formid" action="/submit/recaptcha_v3?my" method="POST">
    <div>
        <label>Username</label>
        <input type="text" name="username"/>
    </div>
    <input id="resp" type="hidden" name="my-captcha-response"/>
    <br/>
    <input id="button" onclick="submitCall(event)" type="button" value="Submit"/>
    <input id="fake-button" onclick="fakeCall(event)" type="button" value="Fake"/>
</form>
</body>
</html>
