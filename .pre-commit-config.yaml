repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks              # scans only the staged changes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key    # blocks keys like conf/ssh_emailUnsub
      - id: check-added-large-files
        args: ["--maxkb=5000"]    # stops a browser-profile tarball slipping in
        # Frozen CrUX snapshots (~6 MB each, see static_lists/README.md) are the only exception
        exclude: ^enfbots-crawler-master/static_lists/crux_[a-z]+_[0-9]{6}\.csv\.xz$
